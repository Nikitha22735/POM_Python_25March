name: Playwright Python Automation CI/CD with Allure

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # runs daily at 9 PM UTC
    

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository from my github
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest
          playwright install --with-deps

      # 4️⃣ Run Playwright tests (parallel, keep artifacts)
      - name: Run Playwright Tests
        run: |
          pytest -n 6 -m "test1234" \
            --alluredir=allure-results \
            --capture=tee-sys
        continue-on-error: true

      # 5️⃣ Verify Allure Results (DEBUG SAFETY)
      - name: Verify Allure Results
        if: always()
        run: |
          echo "Listing allure-results contents:"
          ls -la allure-results || echo "No allure-results directory found"

      # 6️⃣ Install Allure CLI i
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure-2.27.0.zip
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # 7️⃣ Generate Allure HTML report (NO DATA LOSS)
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      # 8️⃣ Deploy to GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      # 9️⃣ Send Allure Report via Email
      - name: Send Test Report Email
        if: always()
        uses: dawiss6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Test Report - ${{ github.repository }} (${{ job.status }})"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Test Execution Report
            =====================
            
            | Metric | Value |
            |--------|-------|
            | Status | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} |
            | Repository | ${{ github.repository }} |
            | Branch | ${{ github.ref }} |
            | Commit | ${{ github.sha }} |
            | Run ID | ${{ github.run_id }} |
            | Triggered By | ${{ github.event_name }} |
            
            **Report Details:**
            | Link | URL |
            |------|-----|
            | Allure Report | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |
            | Run Details | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Commit Link | ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }} |
            
            **Test Execution Summary:**
            - Test Status: ${{ job.status == 'success' && '✅ ALL TESTS PASSED' || '❌ TESTS FAILED' }}
            - Execution Time: Check Allure Report for detailed metrics
            - Parallel Jobs: 6
            
            For detailed test results and metrics, please visit the Allure Report link above.
          attachments: allure-results/
          priority: high